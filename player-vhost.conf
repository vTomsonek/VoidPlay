# =====================================================================
#  Apache vhost dla Voidplay  —  Ubuntu 24.04 + PHP 8.3-FPM
#  Plik: /etc/apache2/sites-available/voidplay.conf
# ---------------------------------------------------------------------
#  Wariant A: własna (sub)domena, np. filmy.twojadomena.pl
#  (na dole pliku jest też wariant B: podkatalog istniejącej strony)
# =====================================================================

<VirtualHost *:80>
    ServerName voidplay.vtbot.net
    DocumentRoot /var/www/voidplay

    <Directory /var/www/voidplay>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # ---- KLUCZOWE: blokada bezpośredniego dostępu do plików wideo ----
    # Filmy serwuje wyłącznie stream.php (po sprawdzeniu klucza).
    <Directory /var/www/voidplay/media>
        Require all denied
    </Directory>

    # ---- Dane aplikacji (liczniki) – też niedostępne z zewnątrz ----
    <Directory /var/www/voidplay/data>
        Require all denied
    </Directory>

    # ---- PHP 8.3 przez FPM (gniazdo unix) ----
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/voidplay_error.log
    CustomLog ${APACHE_LOG_DIR}/voidplay_access.log combined
</VirtualHost>

# =====================================================================
#  Wariant B — jako podkatalog istniejącej strony (np. /voidplay)
#  Wtedy NIE twórz osobnego vhosta. W vhoście istniejącej strony dodaj:
# =====================================================================
#
#   Alias /voidplay /var/www/voidplay
#   <Directory /var/www/voidplay>
#       Options -Indexes +FollowSymLinks
#       AllowOverride None
#       Require all granted
#   </Directory>
#   <Directory /var/www/voidplay/media>
#       Require all denied
#   </Directory>
#
#  Adres dostępu będzie wtedy:
#   https://twojadomena.pl/voidplay/?key=...
